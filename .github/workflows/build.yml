name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build BudgetApp
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 16
        run: sudo xcode-select -s /Applications/Xcode_16.app

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('**/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Install Pods
        run: pod install --repo-update

      - name: Patch BoringSSL-GRPC unsupported -G flag
        run: |
          python3 - <<'EOF'
          import re
          path = 'Pods/Pods.xcodeproj/project.pbxproj'
          with open(path, 'r') as f:
              content = f.read()
          patched = re.sub(r'(?<!\w)-G(?!\w)', '', content)
          with open(path, 'w') as f:
              f.write(patched)
          removed = content.count('-G') - patched.count('-G')
          print(f'Removed {removed} occurrences of -G')
          EOF

      - name: Build
        run: |
          xcodebuild \
            -workspace BudgetApp.xcworkspace \
            -scheme BudgetApp \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            clean build \
            | xcpretty && exit ${PIPESTATUS[0]}
