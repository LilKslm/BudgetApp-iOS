name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build BudgetApp
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 16
        run: sudo xcode-select -s /Applications/Xcode_16.app

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('**/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Install Pods
        run: pod install --repo-update

      - name: Diagnose BoringSSL-GRPC -G flag location
        run: |
          echo "=== BoringSSL Target Support Files ==="
          ls "Pods/Target Support Files/BoringSSL-GRPC/" 2>/dev/null || echo "Dir not found"
          echo ""
          echo "=== xcconfig content ==="
          cat "Pods/Target Support Files/BoringSSL-GRPC/BoringSSL-GRPC.xcconfig" 2>/dev/null || echo "Not found"
          echo ""
          echo "=== grep -G in all Pods files ==="
          grep -rn -- "-G" Pods/ --include="*.xcconfig" --include="*.pbxproj" | head -30 || echo "None found"
          echo ""
          echo "=== grep -G anywhere in Pods ==="
          grep -rn -- " -G[ \"]" Pods/ | head -10 || echo "None found"

      - name: Build (raw output, no xcpretty)
        run: |
          xcodebuild \
            -workspace BudgetApp.xcworkspace \
            -scheme BudgetApp \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            clean build \
            2>&1 | grep -E "(-G|error:|FAILED|CompileC)" | head -40
          exit 0
