name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build BudgetApp
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 16
        run: sudo xcode-select -s /Applications/Xcode_16.app

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('**/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Install Pods
        run: pod install --repo-update

      - name: Patch BoringSSL-GRPC unsupported -G flag
        run: |
          python3 - <<'EOF'
          import os, re

          total = 0
          for root, _, files in os.walk('Pods'):
              for name in files:
                  if not (name.endswith('.xcconfig') or name.endswith('.pbxproj')):
                      continue
                  path = os.path.join(root, name)
                  try:
                      with open(path, 'r', errors='ignore') as f:
                          content = f.read()
                  except Exception:
                      continue
                  if '-G' not in content:
                      continue
                  patched = re.sub(r'(?<!\w)-G(?!\w)', '', content)
                  n = content.count('-G') - patched.count('-G')
                  if n:
                      total += n
                      print(f'Patched {path}: removed {n}')
                      with open(path, 'w') as f:
                          f.write(patched)
          print(f'Total removed: {total}')
          EOF

      - name: Build
        run: |
          xcodebuild \
            -workspace BudgetApp.xcworkspace \
            -scheme BudgetApp \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            clean build \
            | xcpretty && exit ${PIPESTATUS[0]}
