name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build BudgetApp
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Decode GoogleService-Info.plist
        env:
          GS_INFO_B64: ${{ secrets.GS_INFO_B64 }}
        run: bash scripts/decrypt-secrets.sh

      - name: Select Xcode 16
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE_PATH" ]; then
            XCODE_PATH=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          fi
          echo "Using Xcode at: $XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: Pods
          key: ${{ runner.os }}-pods-v4-${{ hashFiles('**/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-v4-

      - name: Install Pods
        run: pod install --repo-update

      - name: Patch BoringSSL-GRPC unsupported -G flag
        run: |
          python3 - <<'EOF'
          import os, re

          # BoringSSL-GRPC COMPILER_FLAGS contains -GCC_WARN_INHIBIT_ALL_WARNINGS
          # Clang parses -G<word> as the -G option (unsupported on iOS simulator)
          # Only remove -G* flags INSIDE COMPILER_FLAGS = "..." strings to avoid
          # corrupting other project references like BoringSSL-GRPC target names.
          def fix_flags(m):
              return 'COMPILER_FLAGS = "' + re.sub(r'\s+-G\w+', '', m.group(1)) + '"'

          total = 0
          for root, _, files in os.walk('Pods'):
              for name in files:
                  if not name.endswith('.pbxproj'):
                      continue
                  path = os.path.join(root, name)
                  try:
                      with open(path, 'r', errors='ignore') as f:
                          content = f.read()
                  except Exception:
                      continue
                  patched = re.sub(r'COMPILER_FLAGS = "([^"]*)"', fix_flags, content)
                  if patched != content:
                      n = sum(1 for _ in re.finditer(r'-G\w+', content))
                      total += n
                      print(f'Patched {path}')
                      with open(path, 'w') as f:
                          f.write(patched)
          print(f'Total patched files: {total}')
          EOF

      - name: Build
        run: |
          xcodebuild \
            -workspace BudgetApp.xcworkspace \
            -scheme BudgetApp \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_USER_SCRIPT_SANDBOXING=NO \
            clean build 2>&1 | tee /tmp/xcodebuild.log; exit ${PIPESTATUS[0]}
