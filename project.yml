name: BudgetApp
options:
  bundleIdPrefix: com.budgetapp
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.10"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  BudgetApp:
    type: application
    platform: iOS
    sources:
      - path: BudgetApp
        excludes:
          - "features.md"
          - "Resources/Info.plist"
          - "Tests/**"
    resources:
      - path: BudgetApp/Resources/Assets.xcassets
        optional: true
      - path: BudgetApp/Resources/Localizable.strings
        optional: true
      - path: BudgetApp/Resources/GoogleService-Info.plist
        optional: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.budgetapp.app
        PRODUCT_NAME: BudgetApp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_STRICT_CONCURRENCY: complete
    # Info.plist is written by XcodeGen from the dict below — never edit the physical file
    # (per appcreation.md §12.4). Add keys here instead.
    info:
      path: BudgetApp/Resources/Info.plist
      properties:
        CFBundleDisplayName: BudgetApp
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIStatusBarStyle: UIStatusBarStyleDefault
        UIViewControllerBasedStatusBarAppearance: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # Google Sign-In URL scheme — replace with production reversed client ID post-enrollment.
        # Tracked in apple-developer-tasks.md item 6.
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - $(GOOGLE_REVERSED_CLIENT_ID)

schemes:
  BudgetApp:
    build:
      targets:
        BudgetApp: all
    run:
      config: Debug
      storeKitConfiguration: BudgetApp/Resources/BudgetApp.storekit
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
